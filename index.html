<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2347">
<title>NLS Library</title>
<meta name="application-name" content="NLS Library">
<meta name="apple-mobile-web-app-title" content="NLS Library">
<style>
:root{--n:#0f2347;--g:#2a5db0;--bg:#e9eef8;--t:#16213a;--m:#5f6c8a;--b:#cdd7ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(140px + env(safe-area-inset-bottom))}
header{background:var(--n);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;border-bottom:3px solid #4a8cff}
header h1{margin:0;font-size:16px;line-height:1.25}header p{margin:2px 0 0;font-size:12px;color:#c3cbe0}
main{padding:12px 14px;max-width:640px;margin:auto}
.card{background:rgba(255,255,255,.95);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--b)}
h2{font-size:15px;margin:0 0 10px}.muted{color:var(--m);font-weight:400;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip,.slot,.spot{border:1.5px solid var(--b);background:#fff;border-radius:8px;padding:9px 12px;font:inherit;color:var(--t);cursor:pointer}
.slot{font-size:13px;padding:9px 4px}.spot{padding:9px 0;font-size:13px;font-weight:600}
.on{background:var(--n)!important;color:#fff!important;border-color:var(--n)!important}
button:disabled{opacity:.4;cursor:not-allowed}
.spot.taken{background:#fbeaea;border-color:#f0c4c4;color:#b55}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.ph{border:2px dashed var(--b);border-radius:10px;background:#f6f7fa;color:var(--m);display:flex;align-items:center;justify-content:center;height:130px;margin-bottom:10px}
.ph.sm{height:auto;min-height:96px;width:92px;margin:0;flex:none;font-size:12px;text-align:center}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;width:100%;margin-top:8px;cursor:pointer}
.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:13px}.btn.ghost{background:#fff;color:var(--n);border:1.5px solid var(--b)}
input{width:100%;padding:12px;border:1.5px solid var(--b);border-radius:10px;font:inherit;margin:6px 0}
.bk{display:flex;gap:12px}.bk>div:last-child{flex:1;min-width:0}
.bd{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:#e8ebf2}
.bd.booked{background:#dbe7fb;color:#1b3f86}.bd.ready,.bd.active{background:#d8f2e3;color:#157a42}.bd.expired,.bd.cancelled{background:#fbe0e0;color:#b33}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b1b3a;border-top:1px solid #1d3a73;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-size:13px;color:#9fb2d6;cursor:pointer}
nav button.on{background:none!important;color:#fff!important;font-weight:700;box-shadow:inset 0 3px #4a8cff}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));height:48px;padding:0 18px;border-radius:26px;border:0;background:var(--g);color:#fff;font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:7;box-shadow:0 3px 10px #0004;cursor:pointer}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}#m.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;margin:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
#vid{display:none;width:100%;border-radius:10px;margin-bottom:8px;background:#000}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
ul{padding-left:18px;margin:0}li{margin-bottom:4px}

</style><script src="jsQR.js" defer></script></head><body>
<header><h1>Shri Narayan Rao Melgiri Memorial National Law Library</h1></header>
<main id="view"></main>
<button class="fab" data-a="ci" aria-label="Scan QR to check in"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Scan QR</span></button>
<nav><button data-a="tab" data-v="book">Book</button><button data-a="tab" data-v="my">My bookings</button><button data-a="tab" data-v="me">Profile</button></nav>
<div id="m"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Floors -> categories [name, QR code letters, count] */
const FL={B:{n:'Basement',c:[['Seat','S',50],['Sofa','SO',20],['Armchair','AC',10]]},
G:{n:'Ground Floor',c:[['Seat','S',50],['Sofa','SO',20],['Armchair','AC',10],['Balcony Bench','BB',10]]},
F:{n:'1st Floor',c:[['Seat','S',100],['Silent Room Seat','SR',50],['Terrace Bench','TB',10],['High Chair','HC',15]]}};
const OPEN=9,CLOSE=24,MAXH=6,GRACE=30,EARLY=10,ADVANCE=3,DEMO=false; /* DEMO: shows some seats as booked by others; set false for real use */
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(x){}return mem[k]==null?null:mem[k]},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}}};
let P=store.get('nl_p'),B=store.get('nl_b')||[];
const save=()=>store.set('nl_b',B);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
B=Array.isArray(B)?B.filter(b=>b&&b.date>=ymd(new Date(Date.now()-30*864e5))):[];
const at=(s,h)=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,h,0,0)};
const fh=h=>{const x=h%24;return(x%12||12)+' '+(x<12?'AM':'PM')};
const tm=d=>(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()<12?'AM':'PM');
const dl=s=>at(s,0).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const code=(f,ci,n)=>`NLSIU-${f}-${FL[f].c[ci][1]}-${n}`;
const lbl=(f,ci,n)=>`${FL[f].c[ci][0]} ${n}`;
const LB={booked:'Booked',ready:'Check-in open',active:'In use',done:'Completed',expired:'Expired',cancelled:'Cancelled'};
const S={tab:'book',date:ymd(new Date()),slots:[],f:'G',cat:0,spot:null};
const holds=s=>s==='booked'||s==='ready'||s==='active';
function st(b,now=new Date()){
 if(b.x)return'cancelled';if(b.out)return'done';
 const s=at(b.date,b.start),en=at(b.date,b.end);
 if(now>=en)return b.chk?'done':'expired';
 if(b.chk)return'active';
 if(now>=new Date(s.getTime()+GRACE*6e4))return'expired';
 if(now>=new Date(s.getTime()-EARLY*6e4))return'ready';
 return'booked';}
const mine=()=>P?B.filter(b=>b.roll===P.roll):[];
const usedH=d=>mine().filter(b=>b.date===d&&(holds(st(b))||(st(b)==='done'&&b.chk))).reduce((a,b)=>a+b.end-b.start,0);
const slotOk=h=>new Date()<new Date(at(S.date,h).getTime()+GRACE*6e4);
function dem(a){let x=0;for(const c of a)x=(x*31+c.charCodeAt(0))>>>0;return x%9===0}
function taken(date,f,ci,n,h,now){
 if(B.some(b=>b.date===date&&b.f===f&&b.ci===ci&&b.n===n&&b.start<=h&&h<b.end&&holds(st(b,now))))return true;
 return DEMO&&dem([date,f,ci,n,h].join('|'));}
const spotFree=(f,ci,n)=>{const now=new Date();return!S.slots.some(h=>taken(S.date,f,ci,n,h,now))};
const runs=a=>{const r=[];[...a].sort((x,y)=>x-y).forEach(h=>{const l=r[r.length-1];if(l&&l[1]===h)l[1]=h+1;else r.push([h,h+1])});return r};
let tt;function toast(t){const o=$('#toast');o.textContent=t;o.style.display='block';clearTimeout(tt);tt=setTimeout(()=>o.style.display='none',2800)}

function vMe(first){
 return`<div class="card"><h2>${first?'Set up your profile to start booking':'Your profile'}</h2>
 <input id="pn" placeholder="Full name" value="${e(P&&P.name)}" autocomplete="name">
 <input id="pr" placeholder="Roll number" value="${e(P&&P.roll)}" autocapitalize="characters">
 <button class="btn" data-a="prof">Save profile</button></div>`;}

function vBook(){
 const used=usedH(S.date),left=MAXH-used;
 const days=[...Array(ADVANCE+1)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return[d,i]});
 let h=`<div class="card"><h2>Day</h2><div class="row">${days.map(([d,i])=>`<button class="chip${ymd(d)===S.date?' on':''}" data-a="date" data-v="${ymd(d)}">${i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</button>`).join('')}</div></div>`;
 h+=`<div class="card"><h2>Time <span class="muted">${S.slots.length} of ${left} hours selected${used?` (${used} h already booked today)`:''}. Maximum ${MAXH} hours a day.</span></h2><div class="grid3">`;
 for(let t=OPEN;t<CLOSE;t++){h+=`<button class="slot${S.slots.includes(t)?' on':''}" data-a="slot" data-v="${t}" ${slotOk(t)?'':'disabled'}>${fh(t)}–${fh(t+1)}</button>`}
 h+='</div></div>';
 if(!S.slots.length)return h+'<div class="card muted">Pick at least one hour to see free seats.</div>'+rules();
 const cats=FL[S.f].c;
 h+=`<div class="card"><h2>Floor</h2><div class="row">${Object.keys(FL).map(k=>`<button class="chip${k===S.f?' on':''}" data-a="floor" data-v="${k}">${FL[k].n}</button>`).join('')}</div>
 <h2 style="margin-top:14px">Spot type</h2><div class="row">${cats.map((c,i)=>`<button class="chip${i===S.cat?' on':''}" data-a="cat" data-v="${i}">${c[0]} (${c[2]})</button>`).join('')}</div></div>`;
 h+=`<div class="card"><h2>${cats[S.cat][0]}s on ${FL[S.f].n} <span class="muted">Grey-red means booked for your hours.</span></h2><div class="grid">`;
 for(let n=1;n<=cats[S.cat][2];n++){const f=spotFree(S.f,S.cat,n);h+=`<button class="spot${f?'':' taken'}${S.spot===n?' on':''}" data-a="spot" data-v="${n}" ${f?'':'disabled'}>${n}</button>`}
 h+='</div></div>';
 if(S.spot!=null){h+=`<div class="card" id="pick"><h2>Your pick</h2><div class="ph">Photo here</div>
 <b>${e(lbl(S.f,S.cat,S.spot))}</b>, ${FL[S.f].n}<div class="muted">QR ID on the table: ${code(S.f,S.cat,S.spot)}</div>
 <div style="margin-top:6px">${dl(S.date)}: ${runs(S.slots).map(r=>fh(r[0])+' – '+fh(r[1])).join(', ')}</div>
 <button class="btn" data-a="book">Confirm booking</button></div>`}
 return h+rules();}
const rules=()=>`<div class="card"><h2>How it works</h2><ul>
<li>Book up to ${ADVANCE} days ahead, 1 to ${MAXH} hours a day.</li>
<li>Scan the QR on your spot within ${GRACE} minutes of your start time. Otherwise the booking expires and others can book it.</li>
<li>Anyone can walk in and use a free spot. If the person who booked it arrives, you need to move.</li></ul></div>`;

function card(b){
 const s=st(b),sd=at(b.date,b.start),by=tm(new Date(sd.getTime()+GRACE*6e4));
 return`<div class="card bk"><div class="ph sm">Photo here</div><div><b>${e(lbl(b.f,b.ci,b.n))}</b><div class="muted">${FL[b.f].n}</div>
 <div>${dl(b.date)}, ${fh(b.start)} – ${fh(b.end)}</div><span class="bd ${s}">${LB[s]}</span>${s==='ready'?` <small>Check in by ${by}</small>`:''}
 <div class="row" style="margin-top:8px">${s==='ready'?'<button class="btn sm" data-a="ci">Check in</button>':''}${s==='active'?`<button class="btn sm" data-a="out" data-v="${b.id}">Check out</button>`:''}${s==='booked'||s==='ready'?`<button class="btn sm ghost" data-a="x" data-v="${b.id}">${S.cx===b.id?'Tap again to cancel':'Cancel'}</button>`:''}</div></div></div>`;}
function vMy(){
 const now=new Date(),L=mine().sort((a,b)=>at(a.date,a.start)-at(b.date,b.start));
 const up=L.filter(b=>holds(st(b,now))),pa=L.filter(b=>!holds(st(b,now))).reverse();
 return`<h2>Upcoming bookings</h2>${up.map(card).join('')||'<div class="card muted">Nothing booked. Tap Book to reserve a spot.</div>'}
 <h2>Past bookings</h2>${pa.map(card).join('')||'<div class="card muted">No past bookings yet.</div>'}`;}

function render(){
 const y=window.scrollY;
 $('#view').innerHTML=(!P&&S.tab!=='me')?vMe(true):S.tab==='book'?vBook():S.tab==='my'?vMy():vMe();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab));
 window.scrollTo(0,y);}

function book(){
 if(!P)return toast('Set up your profile first');
 if(!S.slots.length||S.spot==null)return toast('Pick time and a spot first');
 const now=new Date();
 if(S.slots.length>MAXH-usedH(S.date))return toast('Daily limit is '+MAXH+' hours');
 for(const h of S.slots){
  if(!slotOk(h)){S.slots=S.slots.filter(slotOk);S.spot=null;render();return toast('One of those hours has already passed')}
  if(taken(S.date,S.f,S.cat,S.spot,h,now)){S.spot=null;render();return toast('That spot was just booked. Pick another.')}
  if(mine().some(b=>b.date===S.date&&holds(st(b,now))&&b.start<=h&&h<b.end))return toast('You already have a booking at '+fh(h))}
 runs(S.slots).forEach(([s,en])=>{
  const same=b=>b.date===S.date&&b.f===S.f&&b.ci===S.cat&&b.n===S.spot&&holds(st(b,now));
  const a=mine().find(b=>same(b)&&b.end===s),c=mine().find(b=>same(b)&&b.start===en&&!b.chk);
  if(a)a.end=en;else if(c)c.start=s;
  else B.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),roll:P.roll,name:P.name,date:S.date,start:s,end:en,f:S.f,ci:S.cat,n:S.spot})});
 save();S.slots=[];S.spot=null;S.tab='my';render();toast('Booked. Scan the QR within '+GRACE+' min of start.');}

function openCI(){
 if(!P){S.tab='me';render();return toast('Set up your profile first')}
 $('#m').innerHTML=`<div class="sheet"><h2>Check in</h2><p class="muted">Scan the QR on your spot, or type the ID printed under it, e.g. NLSIU-G-S-12.</p>
 <video id="vid" playsinline muted></video><button class="btn" data-a="scan">Scan again</button>
 <input id="cd" placeholder="NLSIU-G-S-12" autocapitalize="characters" autocomplete="off">
 <button class="btn" data-a="go">Check in</button><button class="btn ghost" data-a="close">Close</button></div>`;
 $('#m').classList.add('show');try{history.pushState({m:1},'')}catch(x){}scan();}
let stream,raf;
function stopCam(){clearTimeout(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function closeM(){stopCam();$('#m').classList.remove('show');$('#m').innerHTML='';if(history.state&&history.state.m)history.back()}
window.addEventListener('popstate',()=>{if($('#m').classList.contains('show'))closeM()});
function checkin(raw){
 const q=String(raw).toUpperCase().match(/NLSIU-[A-Z]-[A-Z]+-\d+/);
 if(!q){toast('That is not a library QR code');return false}
 const now=new Date(),all=mine().filter(b=>code(b.f,b.ci,b.n)===q[0]);
 const m=all.find(b=>st(b,now)==='ready');
 if(m){m.chk=true;save();closeM();render();toast('Checked in. Enjoy your session.');return true}
 toast(all.some(b=>st(b,now)==='booked')?'Too early. Check-in opens '+EARLY+' min before your slot.':'No active booking for this spot.');return false}
const cv=document.createElement('canvas'),cx=cv.getContext('2d');let det=null;
async function decode(v){
 if(det){try{const r=await det.detect(v);return r[0]?r[0].rawValue:null}catch(x){det=null}}
 if(!window.jsQR||!v.videoWidth)return null;
 cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
 const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);return r?r.data:null}
async function scan(){
 const v=$('#vid');if(!v)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('Camera API missing in this app. Type the ID instead.');
 stopCam();let s;
 try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
 catch(x){try{s=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
  catch(y){const n=(y&&y.name)||'Error';
   return toast(n==='NotAllowedError'||n==='SecurityError'?'Camera permission denied ('+n+'). Check Camera is enabled in the app build and phone settings.':n==='NotFoundError'?'No camera found on this device.':n==='NotReadableError'?'Camera is in use by another app.':'Camera error: '+n)}}
 if(!$('#m').classList.contains('show')){s.getTracks().forEach(t=>t.stop());return}
 stream=s;v.srcObject=s;v.style.display='block';
 try{await v.play()}catch(x){}
 det=null;try{if(window.BarcodeDetector)det=new BarcodeDetector({formats:['qr_code']})}catch(x){det=null}
 setTimeout(()=>{if(stream&&!det&&!window.jsQR)toast('Camera is on but QR reading is unavailable here. Type the ID below.')},2500);
 const tick=async()=>{if(!stream)return;let r=null;try{r=await decode(v)}catch(x){}
  if(r){if(checkin(r))return;raf=setTimeout(tick,1500);return}raf=setTimeout(tick,400)};tick();}

function act(a,v){
 if(a==='tab'){S.tab=v;render();window.scrollTo(0,0);return}
 if(a==='date'){S.date=v;S.slots=[];S.spot=null}
 else if(a==='slot'){const h=+v,i=S.slots.indexOf(h);
  if(i>=0)S.slots.splice(i,1);
  else{if(S.slots.length>=MAXH-usedH(S.date))return toast('Maximum '+MAXH+' hours a day');S.slots.push(h);S.slots.sort((x,y)=>x-y)}
  if(S.spot!=null&&!spotFree(S.f,S.cat,S.spot))S.spot=null}
 else if(a==='floor'){S.f=v;S.cat=0;S.spot=null}
 else if(a==='cat'){S.cat=+v;S.spot=null}
 else if(a==='spot'){S.spot=+v;render();const k=$('#pick');if(k)k.scrollIntoView({behavior:'smooth',block:'center'});return}
 else if(a==='book')return book();
 else if(a==='x'){
  if(S.cx!==v){S.cx=v;setTimeout(()=>{if(S.cx===v){S.cx=null;if(S.tab==='my')render()}},4000)}
  else{S.cx=null;const b=B.find(z=>z.id===v);if(b&&holds(st(b))&&st(b)!=='active'){b.x=true;save();toast('Booking cancelled. The spot is free again.')}}}
 else if(a==='out'){const b=B.find(z=>z.id===v);if(b&&st(b)==='active'){b.end=Math.min(b.end,Math.max(b.start+1,new Date().getHours()+1));b.out=true;save();toast('Checked out. Thanks for freeing the spot.')}}
 else if(a==='ci')return openCI();
 else if(a==='scan')return scan();
 else if(a==='go')return checkin($('#cd').value);
 else if(a==='close')return closeM();
 else if(a==='prof'){const n=$('#pn').value.trim(),r=$('#pr').value.trim().toUpperCase();
  if(n.length<2||r.length<3)return toast('Enter your full name and roll number');
  if(P&&P.roll!==r&&mine().some(b=>holds(st(b))))return toast('Cancel your current bookings before changing roll number');
  P={name:n,roll:r};store.set('nl_p',P);S.tab='book';toast('Profile saved')}
 render();}
document.addEventListener('click',ev=>{if(ev.target.id==='m')return closeM();const t=ev.target.closest('[data-a]');if(t&&!t.disabled)act(t.dataset.a,t.dataset.v)});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='cd')act('go')});
const tick=()=>{const a=document.activeElement;if(a&&a.tagName==='INPUT')return;const td=ymd(new Date());if(S.date<td){S.date=td;S.slots=[];S.spot=null}S.slots=S.slots.filter(slotOk);if(!S.slots.length)S.spot=null;render()};
setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();
</script></body></html>
